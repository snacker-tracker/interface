[project]
name = "snacker"
version = "0.1.0"
description = "Builds the static JSON behind the Snacker Tracker interface from raw scanner events."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.116",
    "jsonschema>=4.26.0",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
]

[project.scripts]
snacker = "snacker.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-boto3[lambda,s3]>=1.43.116",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=snacker --cov-report=term --cov-report=lcov:reports/lcov.info"

[tool.mypy]
strict = true
files = ["src", "tests"]
