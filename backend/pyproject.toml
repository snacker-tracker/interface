[project]
name = "snacker"
version = "0.1.0"
description = "Builds the static JSON behind the Snacker Tracker interface from raw scanner events."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=2.0.0",
]

[project.scripts]
snacker = "snacker.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
