[project]
name = "scans-example"
version = "0.1.0"
description = "A stepdag example: Delta tables of real Snacker scans, on container-image Lambdas."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.116",
    "deltalake>=1.0.0",
    "polars>=2.0.0",
    "snacker",
    "stepdag",
]

[tool.uv.sources]
stepdag = { path = "../..", editable = true }
snacker = { path = "../../../backend", editable = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scans_example"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-boto3[s3]>=1.43.116",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Snacker's package is typed (strict in its own project) but ships no py.typed marker.
module = ["snacker", "snacker.*"]
follow_untyped_imports = true
